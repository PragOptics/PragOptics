<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OmniBus Product Brochure — PragOptics</title>
  <!-- base so the brochure's relative assets/ and the vendored renderer resolve -->
  <base href="/docs/">
  <meta name="color-scheme" content="dark">
  <style>
    html, body { margin: 0; background: #05070d; color: #e6edf7;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .bv-status { padding: 48px 24px; text-align: center; color: #9fb3c8; font-size: .95rem; }
  </style>
</head>
<body>
  <!-- The brochure markdown ships its own <style>; rendering it here lets it theme this page.
       This is a chrome-free viewer the main page opens inside an iframe modal. -->
  <div id="brochureRoot"><div class="bv-status">Loading brochure…</div></div>

  <script src="codex/vendor/markdown-it.min.js"></script>
  <script>
    (function () {
      var root = document.getElementById("brochureRoot");
      if (!window.markdownit) { root.innerHTML = '<div class="bv-status">Renderer failed to load.</div>'; return; }
      var md = window.markdownit({ html: true, linkify: true, typographer: true });
      var doc = new URLSearchParams(location.search).get("doc") || "OmniBus-Brochure.md";
      // Only allow safe relative .md paths under /docs (the base href); no traversal.
      if (!/^[\w./-]+\.md$/.test(doc) || doc.indexOf("..") !== -1) doc = "OmniBus-Brochure.md";
      document.title = doc.replace(/^.*\//, "").replace(/\.md$/, "").replace(/-/g, " ") + " — PragOptics";
      fetch(doc, { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("fetch failed"); return r.text(); })
        .then(function (t) { root.innerHTML = md.render(t); })
        .catch(function () { root.innerHTML = '<div class="bv-status">Unable to load the brochure.</div>'; });
    })();
  </script>
</body>
</html>
