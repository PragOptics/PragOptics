<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PragOptics™ :: 404</title>
  <meta name="color-scheme" content="dark" />

  <!-- Icons -->
  <link rel="icon" type="image/x-icon" href="https://pragoptics.com/images/favicon.ico">
  <link rel="icon" type="image/png" href="https://pragoptics.com/images/favicon.png">
  <link rel="apple-touch-icon" href="https://pragoptics.com/images/apple-touch-icon.png">

  <!-- Platform tokens -->
  <link rel="stylesheet" href="https://pragoptics.com/css/tokens.css">
  <link rel="stylesheet" href="https://pragoptics.com/css/base.css">
  <link rel="stylesheet" href="https://pragoptics.com/css/utilities.css">

  <style>
    /* ---------- Base ---------- */
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020407;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* ---------- Starfield ---------- */
    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background:
        radial-gradient(1px 1px at 10% 20%, #9ff 50%, transparent 51%),
        radial-gradient(1px 1px at 80% 30%, #9ff 50%, transparent 51%),
        radial-gradient(1px 1px at 40% 70%, #9ff 50%, transparent 51%),
        radial-gradient(2px 2px at 60% 80%, #c8f 50%, transparent 51%),
        radial-gradient(1px 1px at 25% 50%, #9ff 50%, transparent 51%);
      opacity: 0.35;
    }

    body::after {
      background:
        radial-gradient(circle at 20% 30%, rgba(33,188,165,.08), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(170,120,255,.10), transparent 45%);
    }

    /* ---------- Layout ---------- */
    .p404-wrap {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      position: relative;
      z-index: 1;
    }

    /* ---------- Header ---------- */
    .p404-head {
      padding: 18px 22px;
      border-bottom: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(16px) saturate(160%);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 18px;
    }

    .p404-brand {
      font-weight: 900;
      letter-spacing: .04em;
      font-size: 18px;
      background: linear-gradient(
        130deg,
        var(--ink),
        var(--brand-600),
        var(--brand-purp)
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .p404-meta {
      text-align: right;
    }

    .p404-code {
      font-size: 11px;
      letter-spacing: .22em;
      color: var(--muted);
    }

    .p404-title {
      margin: 6px 0 2px;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: .07em;
    }

    .p404-sub {
      font-size: 13px;
      color: var(--muted);
      max-width: 75ch;
      line-height: 1.55;
    }

    /* ---------- Console Housing ---------- */
    .console-zone {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .console-shell {
      width: min(1400px, 100%);
      height: min(820px, 100%);
      background: linear-gradient(
        180deg,
        rgba(20,28,36,.85),
        rgba(6,10,14,.85)
      );
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.14);
      box-shadow:
        0 40px 120px rgba(0,0,0,.7),
        inset 0 0 0 1px rgba(255,255,255,.06),
        0 0 40px rgba(33,188,165,.12);
      backdrop-filter: blur(18px) saturate(160%);
      padding: 18px;
      position: relative;
    }

    .console-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 22px;
      box-shadow: inset 0 0 120px rgba(170,120,255,.08);
      pointer-events: none;
    }

    /* ---------- Iframe ---------- */
    .console-frame {
      width: 100%;
      height: 100%;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.4);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
    }

    /* ---------- Footer Hint ---------- */
    .p404-hint {
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-size: 11px;
      color: rgba(225,235,250,.55);
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="p404-wrap">

    <!-- Header -->
    <header class="p404-head">
      <div class="p404-brand">
        PragOptics<span class="tm">™</span>
      </div>

      <div class="p404-meta">
        <div class="p404-code">ERROR 404</div>
        <div class="p404-title">ROUTE NOT FOUND</div>
        <div class="p404-sub">
          This path doesn’t exist — but the system is alive.
          Browse the game catalog below and launch one in a new window.
        </div>
      </div>
    </header>

    <!-- Console -->
    <main class="console-zone">
      <div class="console-shell">
        <div class="console-frame">
          <iframe
            title="PragOptics Games Catalog"
            src="https://pragoptics.com/games/">
          </iframe>
        </div>
      </div>

    </main>

  </div>
</body>
</html>
