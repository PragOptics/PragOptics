<!-- ============ COMMUNITY BUILDS ============ -->
<!-- The community page: a showcase wall of shared builds up top, the share
     form beneath it. Uploads are anonymous or with an account.
     Deep link: /#mode=builds -->
<section id="buildsView" class="glass panel builds hidden" aria-labelledby="bdTitle">

  <header class="shop-head">
    <span class="shop-kicker">Community</span>
    <h1 id="bdTitle" class="shop-title">Built by the community.</h1>
    <p class="shop-sub">
      Every unit here was made from the free plans: printed, soldered, and put
      to work. Browse the wall, then add yours: anonymously or with your
      account. Every build makes the designs better.
    </p>
  </header>

  <div class="bd-gallery" id="buildsGallery">
    <!-- Populated by src/builds/builds.js (showcase wall) -->
  </div>

  <div class="bd-share-head">
    <h2 class="bd-share-title">Add yours</h2>
  </div>

  <div class="bd-body" id="buildsBody">
    <!-- Populated by src/builds/builds.js (share form) -->
  </div>

</section>
