<div id="legalMask" class="legal-mask" aria-hidden="true"></div>

<section id="legalPanel" class="legal-panel" role="dialog" aria-modal="true" aria-labelledby="legalTitle" aria-hidden="true">

    <div class="legal-head">
      <h2 id="legalTitle" class="legal-title">Document</h2>
      <button class="modal-close" type="button" aria-label="Close" data-legal-action="close">✕</button>
