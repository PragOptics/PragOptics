<!-- /views/legal.view.html -->
<div id="legalMask" class="legal-mask" aria-hidden="true"></div>

<section id="legalPanel" class="legal-panel" aria-hidden="true">
  <div class="legal-card" tabindex="-1">
    <div class="legal-head">
      <h2 id="legalTitle" class="legal-title">Document</h2>
      <button class="modal-close" type="button" aria-label="Close" data-legal-action="close">✕</button>
    </div>

    <div class="legal-body">
      <div id="legalLoading" class="muted">Loading…</div>
      <article id="legalContent" class="md-view" aria-live="polite"></article>
    </div>

    <div class="legal-foot">
      <a id="legalOpenRaw" class="footer-link" href="#" target="_blank" rel="noopener noreferrer">Open raw</a>
    </div>
  </div>
</section>
