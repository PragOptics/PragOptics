<!-- /views/legal.view.html -->
<div id="legalMask" class="legal-mask" aria-hidden="true"></div>

<section id="legalPanel" class="legal-panel" aria-hidden="true">
  <div class="legal-card" tabindex="-1">
    <div class="legal-head">
      <h2 id="legalTitle" class="legal-title">Document</h2>
      <button class="modal-close" type="button" aria-label="Close" data-legal-action="close">✕</button>
    </div>

    <div class="legal-body">
      <div id="legalLoading" class="muted">Loading…</div>
      <article id="legalContent" class="md-view" aria-live="polite"></article>
    </div>

    <div class="legal-foot">
      <a id="legalOpenRaw" class="footer-link" href="#" target="_blank" rel="noopener noreferrer">Open raw</a>
    </div>
  </div>
</section>

<!-- Product brochure viewer (rich, iframe modal, opens without navigating to /docs/) -->
<div id="brochureMask" class="legal-mask" aria-hidden="true"></div>
<section id="brochurePanel" class="legal-panel" aria-hidden="true">
  <div class="legal-card brochure-card" tabindex="-1">
    <div class="legal-head">
      <h2 class="legal-title">OmniBus Product Brochure</h2>
      <button class="modal-close" type="button" aria-label="Close" data-brochure-action="close">✕</button>
    </div>
    <div class="legal-body brochure-body">
      <iframe id="brochureFrame" class="brochure-frame" title="OmniBus Product Brochure"></iframe>
    </div>
    <div class="legal-foot">
      <a class="footer-link" href="/docs/brochure-view.html" target="_blank" rel="noopener noreferrer">Open in new tab</a>
    </div>
  </div>
</section>
