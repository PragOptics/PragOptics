<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PragOptics™ 404 :: BLOCK BREACH</title>

<meta name="color-scheme" content="dark">

  <!-- Icons -->
  <link rel="icon" type="image/x-icon" href="https://pragoptics.com/images/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" href="https://pragoptics.com/images/favicon.png" sizes="192x192">
  <link rel="apple-touch-icon" href="https://pragoptics.com/images/apple-touch-icon.png">

<style>
:root{
  --bg0:#020406;
  --ink:#9ff;
  --muted:rgba(160,220,220,.85);
  --line:rgba(120,255,255,.18);
}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:radial-gradient(circle at top,#0e1620,#030609);
  font-family:ui-monospace,monospace;
  color:var(--ink);
}

#hud{
  padding:10px 16px;
  border-bottom:1px solid var(--line);
}

#hudRow{
  display:flex;
  justify-content:space-between;
}

canvas{
  display:block;
}
</style>
</head>

<body>

<header id="hud">
  <div id="hudRow">
    <div>SCORE <span id="score">0</span></div>
    <div>COMBO <span id="combo">x1</span></div>
    <div>LEVEL <span id="level">1</span></div>
    <div>LIVES <span id="lives">💚💚💚</span></div>
  </div>
</header>

<canvas id="c"></canvas>

<script>
(()=>{
"use strict";

/* ================= CANVAS ================= */
const c = document.getElementById("c");
const ctx = c.getContext("2d");

let W=0,H=0;
function resize(){
  W = c.width = innerWidth;
  H = c.height = innerHeight - 60;
}
addEventListener("resize",resize);
resize();

/* ================= AUDIO ================= */
const AC = new (window.AudioContext||window.webkitAudioContext)();
let audioArmed=false;
addEventListener("keydown",()=>{ if(!audioArmed){audioArmed=true;AC.resume();}});
function beep(f,d=0.04){
  if(!audioArmed) return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.value=f;g.gain.value=0.05;
  o.connect(g).connect(AC.destination);
  o.start();o.stop(AC.currentTime+d);
}


/* ================= INPUT ================= */
const keys = Object.create(null);
const press = Object.create(null);

addEventListener("keydown", (e) => {
  if (!keys[e.code]) press[e.code] = 1;
  keys[e.code] = 1;
  if (e.code === "Space") e.preventDefault();
});

addEventListener("keyup", (e) => {
  keys[e.code] = 0;
});

function clearPress(){
  for(const k in press) delete press[k];
}
/* ================= PWRUP ================= */
const PWR = {
  multi:  { c:"#b58cff", g:"M" },
  expand: { c:"#21bca5", g:"E" },
  slow:   { c:"#ffd42a", g:"S" },
  life:   { c:"#2aff8a", g:"+" }
};

/* ================= CONFIG ================= */
const CFG={
  paddle:{ w:120, h:14, speed:8 },
  ball:{ r:6, speed:5 },
  powerupFall:2.2
};

/* ================= STATE ================= */
const S={
  phase:"serve",
  score:0,
  combo:1,
  lives:3,
  shake:0,
  level:1,

  balls:[],
  bricks:[],
  powerups:[],

  paddle:{ x:0 },

  effects:{
    expandT:0,
    slowT:0
  }
};

/* ================= INIT ================= */
function resetGame(){
  S.score=0;
  S.combo=1;
  S.lives=3;
  S.level=1;
  S.phase="serve";
  S.balls=[];
  S.powerups=[];
  S.effects.expandT=0;
  S.effects.slowT=0;

  S.paddle.x = W/2;
  spawnBall(true);
  spawnBricks();
}


function spawnBall(stuck=true){
  S.balls.push({
    x: S.paddle.x,
    y: H - 80,
    vx: 0,
    vy: 0,
    stuck: !!stuck,
    squish: 0
  });
}

function ballSpeed(){
  return CFG.ball.speed + (S.level - 1) * 0.55;
}

function launchServe(){
  S.phase = "play";
  for(const b of S.balls){
    if(!b.stuck) continue;
    b.stuck = false;
    b.vx = rand(-2.5, 2.5);
    b.vy = -ballSpeed();
  }
  beep(520, 0.06);
}



function spawnBricks(){
  S.bricks = [];

  const rows = Math.min(10, 6 + Math.floor((S.level-1) * 0.4));
  const cols = 12;

  const topPad = 44;
  const bw = W / cols;
  const bh = 24;

  const baseHp = Math.min(4, 1 + Math.floor((S.level-1) / 3));

  for(let y=0;y<rows;y++){
    for(let x=0;x<cols;x++){
      // layout variance: carve “holes” that change every level
      if(((x + y*2 + S.level) % 11) === 0) continue;
      if(((x*3 + y + S.level) % 17) === 0) continue;

      // hp gradient + level scaling
      const band = (y < 2) ? 2 : (y < 4) ? 1 : 0;
      const hp = Math.max(1, Math.min(4, baseHp + band));

      S.bricks.push({
        x: x*bw,
        y: y*bh + topPad,
        w: bw,
        h: bh,
        hp
      });
    }
  }
}

/* ================= HELPERS ================= */
const rand=(a,b)=>a+Math.random()*(b-a);

/* ================= UPDATE ================= */

function updatePaddle(){
  if(keys.ArrowLeft) S.paddle.x -= CFG.paddle.speed;
  if(keys.ArrowRight) S.paddle.x += CFG.paddle.speed;

  const w = CFG.paddle.w * (S.effects.expandT>0?1.6:1);
  S.paddle.x = Math.max(w/2, Math.min(W-w/2, S.paddle.x));
}

function updateBalls(){
// Serve: ball sticks to paddle until Space
  if(S.phase === "serve"){
    const pw = CFG.paddle.w * (S.effects.expandT>0?1.6:1);
    const py = H - 30;
    for(const b of S.balls){
      if(!b.stuck) continue;
      b.x = S.paddle.x;
      b.y = py - CFG.ball.r - 2;
      b.vx = 0;
      b.vy = 0;
    }
    if(press.Space) launchServe();
  }

  for(let i=S.balls.length-1;i>=0;i--){
    const b=S.balls[i];
    // decay squish each frame
    if (b.squish) {
      b.squish *= 0.85;
      if (b.squish < 0.05) b.squish = 0;
    }
    if(b.stuck) continue;

    const slow = S.effects.slowT>0 ? 0.7 : 1;

    b.x += b.vx * slow;
    b.y += b.vy * slow;

    // walls
    if(b.x<CFG.ball.r||b.x>W-CFG.ball.r){ b.vx*=-1; beep(200);}
    if(b.y<CFG.ball.r){ b.vy*=-1; beep(260);}

    // paddle
    const pw = CFG.paddle.w * (S.effects.expandT>0?1.6:1);
    if(b.y>H-40){
      if(Math.abs(b.x-S.paddle.x)<pw/2){
        const dx=(b.x-S.paddle.x)/(pw/2);
        b.vx = dx*6;
        b.vy = -Math.abs(b.vy);
        S.combo=1;
        b.squish = 6;
        beep(400);
      }else if(b.y>H){
        S.balls.splice(i,1);
      }
    }
  }

  if(S.balls.length===0){
    S.lives--;
    S.combo = 1;

    if(S.lives<=0){
      S.phase="dead";
    }else{
      // re-serve: single stuck ball
      S.balls.length = 0;
      S.phase = "serve";
      spawnBall(true);
    }
  }
}

function updateBricks(){
  for(let i=S.bricks.length-1;i>=0;i--){
    const br=S.bricks[i];

    for(const b of S.balls){
      if(b.x>br.x && b.x<br.x+br.w &&
         b.y>br.y && b.y<br.y+br.h){

        br.hp--;
        b.vy*=-1;

        S.score+=10*S.combo;
        S.combo++;

        if(Math.random()<0.15){
          spawnPowerup(br.x+br.w/2, br.y+br.h/2);
        }

        if(br.hp<=0){
          S.bricks.splice(i,1);
        }

        break;
      }
    }
  }

  if(S.bricks.length===0){
    S.level++;
    S.combo = 1;
    S.phase = "serve";
    S.balls.length = 0;
    spawnBall(true);
    spawnBricks();
    beep(300, 0.10);
  }
}

function spawnPowerup(x,y){
  const types=["multi","expand","slow","life"];
  S.powerups.push({
    x,y,
    vy:CFG.powerupFall,
    type:types[Math.floor(Math.random()*types.length)]
  });
}

function updatePowerups(){
  for(let i=S.powerups.length-1;i>=0;i--){
    const p=S.powerups[i];
    p.y+=p.vy;
    p.x += Math.sin((p.y + p.x) * 0.02) * 0.15;

    const pw = CFG.paddle.w * (S.effects.expandT>0?1.6:1);

    if(p.y>H-40 && Math.abs(p.x-S.paddle.x)<pw/2){
      applyPowerup(p.type);
      S.powerups.splice(i,1);
    }

    if(p.y>H) S.powerups.splice(i,1);
  }

  if(S.effects.expandT>0) S.effects.expandT--;
  if(S.effects.slowT>0) S.effects.slowT--;
}

function applyPowerup(t){
  beep(700);

  if(t==="multi"){
    const copy=[...S.balls];
    for(const b of copy){
      S.balls.push({...b, vx:-b.vx});
    }
  }

  if(t==="expand") S.effects.expandT=600;
  if(t==="slow") S.effects.slowT=600;
  if(t==="life") S.lives++;
}

/* ================= DRAW ================= */

function draw(){
  // backdrop
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, "#050a10");
  g.addColorStop(1, "#020406");
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // faint grid
  ctx.globalAlpha = 0.15;
  ctx.strokeStyle = "#0d1b22";
  for(let x=0;x<W;x+=64){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<H;y+=64){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.globalAlpha = 1;

  // paddle
  const pw = CFG.paddle.w * (S.effects.expandT>0?1.6:1);
  ctx.fillStyle="#9ff";
  ctx.fillRect(S.paddle.x-pw/2,H-30,pw,CFG.paddle.h);


  // balls (squishy energy orbs)
for(const b of S.balls){
  const r = CFG.ball.r;

  // velocity magnitude
  const vx = b.vx || 0;
  const vy = b.vy || 0;
  const speed = Math.hypot(vx, vy);

  // squash & stretch factors
  const extra = (b.squish || 0) * 0.05;
  const stretch = Math.min(1.8, 1 + speed * 0.08 + extra);
  const squash  = Math.max(0.65, 1 - speed * 0.04 - extra * 0.45);

  // direction bias
  const dx = vx !== 0 ? vx / speed || 0 : 0;
  const dy = vy !== 0 ? vy / speed || 0 : 0;

  ctx.save();
  ctx.translate(b.x, b.y);

  // align stretch to movement direction
  ctx.rotate(Math.atan2(dy, dx));

  // outer glow
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = "#9ff";
  ctx.beginPath();
  ctx.ellipse(0, 0, r * stretch * 1.6, r * squash * 1.6, 0, 0, Math.PI * 2);
  ctx.fill();

  // main body
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.ellipse(0, 0, r * stretch, r * squash, 0, 0, Math.PI * 2);
  ctx.fill();

  // inner core (slight lag = squishy feel)
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = "#dfffff";
  ctx.beginPath();
  ctx.ellipse(
    -dx * 1.5,
    -dy * 1.5,
    r * 0.5,
    r * 0.5,
    0,
    0,
    Math.PI * 2
  );
  ctx.fill();

  ctx.restore();
}


  // bricks
  for(const br of S.bricks){
    ctx.fillStyle=br.hp===3?"#ff5a5a":br.hp===2?"#ffd42a":"#2aff8a";
    ctx.fillRect(br.x+2,br.y+2,br.w-4,br.h-4);
  }

  // powerups
  // powerups
for(const p of S.powerups){
  const meta = PWR[p.type] || { c:"#9ff", g:"?" };

  // glow ring
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = meta.c;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 12, 0, Math.PI*2);
  ctx.fill();

  // core
  ctx.globalAlpha = 1;
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath();
  ctx.arc(p.x, p.y, 9, 0, Math.PI*2);
  ctx.fill();

  // glyph
  ctx.fillStyle = meta.c;
  ctx.font = "12px ui-monospace, monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(meta.g, p.x, p.y + 0.5);
}
ctx.textAlign = "left";
ctx.textBaseline = "alphabetic";

  if(S.phase==="dead"){
    ctx.fillStyle="rgba(0,0,0,.7)";
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#ff5a5a";
    ctx.font = "22px ui-monospace, monospace";
    ctx.fillText("SYSTEM BREACH",W/2-90,H/2);
    ctx.fillStyle="#9ff";
    ctx.font = "14px ui-monospace, monospace";
    ctx.fillText("Press F5 to reboot",W/2-70,H/2+22);
  }
}

/* ================= HUD ================= */

function syncHUD(){
  document.getElementById("score").textContent=S.score;
  document.getElementById("combo").textContent="x"+S.combo;
  document.getElementById("level").textContent = S.level;

  let hearts="";
  for(let i=0;i<S.lives;i++) hearts+="💚";
  document.getElementById("lives").textContent=hearts;
}

/* ================= LOOP ================= */

function tick(){
  if(S.phase==="dead"){
    clearPress();
    return;
  }

  updatePaddle();
  updateBalls();
  updateBricks();
  updatePowerups();
  clearPress();
}

function frame(){
  tick();
  draw();
  syncHUD();
  requestAnimationFrame(frame);
}

resetGame();
frame();

})();
</script>

</body>
</html>
