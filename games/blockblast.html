<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PragOptics™ :: BLOCK BLAST</title>

<style>
:root{
  --bg0:#020406;
  --ink:#9ff;
  --muted:rgba(160,220,220,.85);
  --line:rgba(120,255,255,.18);
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:radial-gradient(circle at top,#0e1620,#030609);
  font-family:ui-monospace,monospace;
  color:var(--ink);
}

/* HUD (UNCHANGED) */
#hud{
  padding:10px 16px;
  border-bottom:1px solid var(--line);
}

#hudTop{
  display:flex;
  justify-content:space-between;
  border-bottom:1px dashed rgba(120,255,255,.15);
}

#hudMid{
  margin-top:8px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
}

.card{padding:10px}
.big{font-size:20px}

/* GAME */
#gameWrap{
  width:100%;
  height:calc(100vh - 120px);
  position:relative;
}

canvas{
  position:absolute;
  inset:0;
}

/* overlay */
#overlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.7);
  flex-direction:column;
}
</style>
</head>

<body>

<header id="hud">
  <div id="hudTop">
    <div>BLOCK BLAST</div>
    <div>Click • R reset</div>
  </div>
  <div id="hudMid">
    <div class="card">Score <div id="score" class="big">0</div></div>
    <div class="card">Combo <div id="combo" class="big">x1</div></div>
    <div class="card">Best <div id="best" class="big">0</div></div>
  </div>
</header>

<main id="gameWrap">
  <canvas id="c"></canvas>
  <div id="overlay">SYSTEM LOCK</div>
</main>

<script>
(()=>{
"use strict";

/* ========= CANVAS ========= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let W=0,H=0,SIZE=0,OFFSET_X=0,OFFSET_Y=0;
const GRID=10;

function resize(){
  const wrap = document.getElementById("gameWrap");
  W = wrap.clientWidth;
  H = wrap.clientHeight;

  canvas.width = W;
  canvas.height = H;

  const boardSize = Math.min(W,H);
  SIZE = boardSize / GRID;

  OFFSET_X = (W - boardSize)/2;
  OFFSET_Y = (H - boardSize)/2;
}
addEventListener("resize",resize);

/* ========= AUDIO ========= */
const AC=new (window.AudioContext||window.webkitAudioContext)();
let armed=false;
addEventListener("pointerdown",()=>{if(!armed){armed=true;AC.resume();}});
function beep(f){
  if(!armed) return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.value=f;
  g.gain.value=0.05;
  o.connect(g).connect(AC.destination);
  o.start();o.stop(AC.currentTime+0.05);
}

/* ========= STATE ========= */
const COLORS=["#2aff8a","#ffd42a","#ff5a5a","#9ff"];

const S={
  grid:[],
  score:0,
  combo:1,
  best:Number(localStorage.blockBlastBest||0),
  dead:false,
  shake:0
};

/* ========= INIT ========= */
function newGrid(){
  S.grid=[];
  for(let y=0;y<GRID;y++){
    let r=[];
    for(let x=0;x<GRID;x++){
      r.push(Math.floor(Math.random()*COLORS.length));
    }
    S.grid.push(r);
  }
}

/* ========= FLOOD ========= */
function flood(x,y,t,seen){
  if(x<0||y<0||x>=GRID||y>=GRID) return 0;
  if(seen[y][x]) return 0;
  if(S.grid[y][x]!==t) return 0;
  seen[y][x]=1;
  return 1+
    flood(x+1,y,t,seen)+
    flood(x-1,y,t,seen)+
    flood(x,y+1,t,seen)+
    flood(x,y-1,t,seen);
}

function clearFlood(x,y,t,seen){
  if(x<0||y<0||x>=GRID||y>=GRID) return;
  if(seen[y][x]) return;
  if(S.grid[y][x]!==t) return;
  seen[y][x]=1;
  S.grid[y][x]=null;
  clearFlood(x+1,y,t,seen);
  clearFlood(x-1,y,t,seen);
  clearFlood(x,y+1,t,seen);
  clearFlood(x,y-1,t,seen);
}

/* ========= GRAVITY ========= */
function drop(){
  for(let x=0;x<GRID;x++){
    let col=[];
    for(let y=GRID-1;y>=0;y--) if(S.grid[y][x]!=null) col.push(S.grid[y][x]);
    for(let y=GRID-1;y>=0;y--) S.grid[y][x]=col[GRID-1-y]??null;
  }
}
function slide(){
  let w=0;
  for(let x=0;x<GRID;x++){
    if(S.grid[GRID-1][x]!=null){
      if(x!==w){
        for(let y=0;y<GRID;y++){
          S.grid[y][w]=S.grid[y][x];
          S.grid[y][x]=null;
        }
      }
      w++;
    }
  }
}

/* ========= INPUT ========= */
canvas.addEventListener("click",e=>{
  if(S.dead) return;

  const rect=canvas.getBoundingClientRect();
  const x=((e.clientX-rect.left-OFFSET_X)/SIZE)|0;
  const y=((e.clientY-rect.top-OFFSET_Y)/SIZE)|0;

  if(x<0||y<0||x>=GRID||y>=GRID) return;

  const t=S.grid[y][x];
  if(t==null) return;

  const seen=Array.from({length:GRID},()=>Array(GRID).fill(0));
  const n=flood(x,y,t,seen);

  if(n<2){S.combo=1;return;}

  clearFlood(x,y,t,Array.from({length:GRID},()=>Array(GRID).fill(0)));
  drop();slide();

  S.score+=n*n*10*S.combo;
  S.combo++;
  S.shake=8;

  beep(200+n*25);

  if(!hasMoves()){
    S.dead=true;
    document.getElementById("overlay").style.display="flex";
    if(S.score>S.best){
      S.best=S.score;
      localStorage.blockBlastBest=S.best;
    }
  }
});

/* ========= CHECK ========= */
function hasMoves(){
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
    const t=S.grid[y][x];
    if(t==null) continue;
    if(x<GRID-1&&S.grid[y][x+1]===t) return true;
    if(y<GRID-1&&S.grid[y+1][x]===t) return true;
  }
  return false;
}

/* ========= RESET ========= */
addEventListener("keydown",e=>{
  if(e.code==="KeyR"){
    S.score=0;S.combo=1;S.dead=false;
    document.getElementById("overlay").style.display="none";
    newGrid();
  }
});

/* ========= DRAW ========= */
function draw(){
  ctx.save();

  if(S.shake){
    ctx.translate((Math.random()-0.5)*S.shake,(Math.random()-0.5)*S.shake);
    S.shake*=0.9;
  }

  ctx.clearRect(0,0,W,H);

  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
    const v=S.grid[y][x];
    if(v==null) continue;

    ctx.fillStyle=COLORS[v];
    ctx.fillRect(
      OFFSET_X + x*SIZE +2,
      OFFSET_Y + y*SIZE +2,
      SIZE-4,
      SIZE-4
    );
  }

  ctx.restore();
}

/* ========= LOOP ========= */
function loop(){
  draw();
  document.getElementById("score").textContent=S.score;
  document.getElementById("combo").textContent="x"+S.combo;
  document.getElementById("best").textContent=S.best;
  requestAnimationFrame(loop);
}

/* START */
resize();
newGrid();
loop();

})();
</script>
</body>
</html>
